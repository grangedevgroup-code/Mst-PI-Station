{% extends "base.html" %}
{% block title %}Config{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-cyan-400">Configuration</h1>
    <p class="text-gray-500 text-sm font-mono">{{ config_file }}</p>
</div>

<div x-data="configEditor()" x-init="init()">
    <div class="mb-4 flex items-center justify-between">
        <div class="flex gap-2">
            <button @click="save()" class="btn btn-primary">Save</button>
            <button @click="reload()" class="btn btn-secondary">Reload</button>
        </div>
        <div x-show="message" x-text="message"
             :class="success ? 'text-green-400' : 'text-red-400'"
             class="text-sm"></div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
        <textarea
            x-model="content"
            class="w-full h-[60vh] bg-gray-950 text-gray-100 font-mono text-sm p-4 resize-none focus:outline-none focus:ring-1 focus:ring-cyan-500"
            spellcheck="false"
        >{{ config_text }}</textarea>
    </div>

    <div class="mt-4 text-xs text-gray-600">
        After saving, run <code class="text-cyan-400">sudo mstpistation deploy &lt;profile&gt;</code> to apply changes.
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function configEditor() {
    return {
        content: `{{ config_text | replace('`', '\\`') | replace('${', '\\${') }}`,
        message: '',
        success: false,
        init() {},
        async save() {
            const form = new FormData();
            form.append('config_text', this.content);
            const res = await fetch('/config', {method: 'POST', body: form});
            const data = await res.json();
            this.message = data.message;
            this.success = data.success;
            setTimeout(() => this.message = '', 4000);
        },
        reload() {
            this.content = document.querySelector('textarea').defaultValue;
        }
    }
}
</script>
{% endblock %}
