name: emergency
version: "system"
description: "Emergency alerts — LXMF broadcast to all mesh nodes, CLI trigger, escalating retransmit"
type: native
service: aetherium-emergency
binary: python3
requires_hardware: []
resource_budget:
  cpu: "0.02"
  memory: "15M"
  disk: "5M"
profiles_default_on: [relay, mesh-hub, field-node, emergency]
notes: "CLI: aetherium emergency send 'SOS message'. Broadcasts via LXMF to all known peers."
