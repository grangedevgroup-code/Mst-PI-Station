name: syncthing
version: "latest"
description: "Syncthing — continuous peer-to-peer file synchronization across mesh nodes"
type: container
requires_hardware: []
needs_docker: true
min_ram_mb: 512           # light enough for a 512 MB board
resource_budget:
  cpu: "0.3"
  memory: "128M"
  disk: "500M"
profiles_default_on: [mesh-hub, local-services, hotspot]
