version: "3.8"
services:
  conduit:
    image: matrixconduit/matrix-conduit:latest
    container_name: aetherium-matrix
    restart: unless-stopped
    volumes:
      - /var/lib/aetherium/matrix:/var/lib/matrix-conduit
    environment:
      CONDUIT_SERVER_NAME: "aetherium.local"
      CONDUIT_DATABASE_PATH: "/var/lib/matrix-conduit/conduit.db"
      CONDUIT_DATABASE_BACKEND: "rocksdb"
      CONDUIT_PORT: "6167"
      CONDUIT_MAX_REQUEST_SIZE: "20_000_000"
      CONDUIT_ALLOW_REGISTRATION: "true"
      CONDUIT_ALLOW_FEDERATION: "false"
      CONDUIT_ALLOW_CHECK_FOR_UPDATES: "false"
      CONDUIT_TRUSTED_SERVERS: "[]"
      CONDUIT_LOG: "warn"
    ports:
      - "6167:6167"
