name: matrix
version: "system"
description: "Matrix Conduit — lightweight Matrix homeserver for encrypted mesh messaging (~50MB RAM)"
type: docker
service: mstpistation-matrix
binary: docker
requires_hardware: []
needs_docker: true
min_ram_mb: 1024          # defer on boards under 1 GB
resource_budget:
  cpu: "0.10"
  memory: "60M"
  disk: "100M"
profiles_default_on: [mesh-hub]
notes: "Server name = mstpistation.local. Connect with any Matrix client (Element, FluffyChat). Port 6167."
