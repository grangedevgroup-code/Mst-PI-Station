name: gitea
version: "system"
description: "Gitea — lightweight offline git server for code/config/doc sharing over mesh"
type: docker
service: aetherium-gitea
binary: docker
requires_hardware: []
resource_budget:
  cpu: "0.10"
  memory: "100M"
  disk: "200M"
profiles_default_on: [mesh-hub, local-services]
notes: "Web UI at http://aetherium.local:3000. Admin setup on first visit."
