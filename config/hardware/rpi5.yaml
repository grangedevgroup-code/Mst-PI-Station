# Raspberry Pi 5 hardware defaults
network:
  ap_interface: wlan0
  mesh_interface: wlan1          # assumes USB Wi-Fi adapter for dual-radio
  uplink_interface: eth0

power:
  mode: balanced
  cpu_governor: ondemand

# Pi 5 has enough RAM for monitoring
modules:
  monitoring:
    enabled: false               # disabled by default, user can enable
